name: Build NetHunter WiFi Modules - Realme C51

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'kernel_config/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Checkout Realme repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: realme-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make gcc build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libncurses-dev libelf-dev \
            python3 zip unzip cpio wget \
            dwarves device-tree-compiler kmod

      - name: Clone Clang toolchain
        run: |
          git clone --depth=1 -b 14 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone/ clang
          clang/bin/clang --version | head -2

      - name: Clone AOSP GKI 5.15 kernel
        run: |
          git init kernel
          git -C kernel remote add origin https://android.googlesource.com/kernel/common
          git -C kernel fetch --depth=1 origin refs/tags/android13-5.15.178_r00
          git -C kernel checkout --detach FETCH_HEAD

          cd kernel
          echo "=== Exact pinned kernel version ==="
          git rev-parse HEAD
          head -5 Makefile
          test "$(grep '^SUBLEVEL' Makefile | awk '{print $3}')" = "178"

      - name: Configure from exact live RMX3830 config
        run: |
          set -euo pipefail
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          stock_config=$GITHUB_WORKSPACE/realme-src/kernel_config/RMX3830-Android15-5.15.178-stock.config
          test -s "$stock_config"
          mkdir -p out
          cp "$stock_config" out/.config
          cp "$stock_config" /tmp/phone-stock.config

          # Change only the features needed by mac80211 + AR9271. Keep every
          # other recognized option from the phone's live /proc/config.gz.
          scripts/config --file out/.config             --module MAC80211             --enable MAC80211_HAS_RC             --enable MAC80211_RC_MINSTREL             --enable MAC80211_MESH             --enable WLAN_VENDOR_ATH             --module ATH_COMMON             --module ATH9K_HW             --module ATH9K_COMMON             --module ATH9K_HTC             --enable ATH9K_BTCOEX_SUPPORT             --set-str LOCALVERSION "-android13-8-ge7eb24fc4398-ab516"             --disable LOCALVERSION_AUTO

          make O=out ARCH=arm64             CC=clang             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             LLVM=1 LLVM_IAS=1             olddefconfig

          mkdir -p $GITHUB_WORKSPACE/artifact/layout
          python3 - << 'PYEOF'
          import pathlib
          def parse(path):
              out = {}
              for line in pathlib.Path(path).read_text().splitlines():
                  if line.startswith("CONFIG_") and "=" in line:
                      k, v = line.split("=", 1); out[k] = v
                  elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                      out[line[2:-11]] = "n"
              return out
          before = parse("/tmp/phone-stock.config")
          after = parse("out/.config")
          keys = sorted(set(before) | set(after))
          lines = [f"{k}: {before.get(k, '<absent>')} -> {after.get(k, '<absent>')}"
                   for k in keys if before.get(k) != after.get(k)]
          pathlib.Path("/tmp/config-delta.txt").write_text("\n".join(lines) + "\n")
          print(f"Config delta: {len(lines)} symbols (full list saved as an artifact)")
          for line in lines:
              if line.startswith(("CONFIG_CFG80211", "CONFIG_RFKILL")):
                  raise SystemExit("FATAL: stock cfg80211/rfkill ABI option changed: " + line)
          PYEOF
          cp /tmp/config-delta.txt $GITHUB_WORKSPACE/artifact/layout/

          required_config=(
            CONFIG_CFG80211=m
            CONFIG_MAC80211=m
            CONFIG_WLAN_VENDOR_ATH=y
            CONFIG_ATH_COMMON=m
            CONFIG_ATH9K_HW=m
            CONFIG_ATH9K_COMMON=m
            CONFIG_ATH9K_HTC=m
            CONFIG_LTO_CLANG_FULL=y
            CONFIG_CFI_CLANG=y
            CONFIG_CFI_CLANG_SHADOW=y
            CONFIG_SHADOW_CALL_STACK=y
            CONFIG_MODVERSIONS=y
          )
          for setting in "${required_config[@]}"; do
            grep -qx "$setting" out/.config || {
              echo "FATAL: required setting missing: $setting"
              exit 1
            }
          done
          grep -qx 'CONFIG_LOCALVERSION="-android13-8-ge7eb24fc4398-ab516"' out/.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' out/.config
          echo "=== Exact-config gate passed ==="

      - name: Inject stock Module.symvers for CRC matching
        run: |
          cd kernel

          # Start with the Module.symvers from the repo (extracted from stock modules)
          cp $GITHUB_WORKSPACE/realme-src/Module.symvers out/Module.symvers
          echo "=== Base Module.symvers: $(wc -l < out/Module.symvers) entries ==="

          # Extract additional CRCs from stock modules
          if [ -f "$GITHUB_WORKSPACE/realme-src/stock_modules.tar.gz" ]; then
            mkdir -p /tmp/stock_modules
            tar xzf "$GITHUB_WORKSPACE/realme-src/stock_modules.tar.gz" -C /tmp/stock_modules/
            echo "=== Stock modules extracted: $(find /tmp/stock_modules -name '*.ko' | wc -l) ==="

            # Extract __versions CRCs from each stock module using modinfo/objdump
            python3 << 'PYEOF'
          import struct, os, glob

          def parse_elf_versions(filepath):
              crc_map = {}
              with open(filepath, 'rb') as f:
                  data = f.read()
              if data[:4] != b'\x7fELF':
                  return crc_map
              e_shoff = struct.unpack('<Q', data[40:48])[0]
              e_shentsize = struct.unpack('<H', data[58:60])[0]
              e_shnum = struct.unpack('<H', data[60:62])[0]
              e_shstrndx = struct.unpack('<H', data[62:64])[0]
              shstr_offset = e_shoff + e_shstrndx * e_shentsize
              shstr_sh_offset = struct.unpack('<Q', data[shstr_offset+24:shstr_offset+32])[0]
              shstr_sh_size = struct.unpack('<Q', data[shstr_offset+32:shstr_offset+40])[0]
              shstrtab = data[shstr_sh_offset:shstr_sh_offset+shstr_sh_size]
              for i in range(e_shnum):
                  sh_offset = e_shoff + i * e_shentsize
                  sh_name_idx = struct.unpack('<I', data[sh_offset:sh_offset+4])[0]
                  name_end = shstrtab.find(b'\x00', sh_name_idx)
                  section_name = shstrtab[sh_name_idx:name_end].decode('ascii', errors='ignore')
                  if section_name == '__versions':
                      sh_sec_offset = struct.unpack('<Q', data[sh_offset+24:sh_offset+32])[0]
                      sh_sec_size = struct.unpack('<Q', data[sh_offset+32:sh_offset+40])[0]
                      entry_size = 64
                      for j in range(0, sh_sec_size - entry_size + 1, entry_size):
                          pos = sh_sec_offset + j
                          crc = struct.unpack('<I', data[pos:pos+4])[0]
                          name_bytes = data[pos+8:pos+entry_size]
                          null_idx = name_bytes.find(b'\x00')
                          if null_idx > 0 and crc != 0:
                              name = name_bytes[:null_idx].decode('ascii', errors='ignore')
                              if name and all(c.isalnum() or c == '_' for c in name):
                                  crc_map[name] = crc
                      break
              return crc_map

          # Read existing Module.symvers
          existing = {}
          with open('out/Module.symvers') as f:
              for line in f:
                  parts = line.strip().split('\t')
                  if len(parts) >= 2:
                      existing[parts[1]] = parts[0]

          # Extract from all stock modules
          all_crcs = {}
          for ko in glob.glob('/tmp/stock_modules/*.ko'):
              crcs = parse_elf_versions(ko)
              for sym, crc in crcs.items():
                  all_crcs[sym] = f'0x{crc:08x}'

          # Merge: stock module CRCs override
          for sym, crc in all_crcs.items():
              existing[sym] = crc

          # Write merged Module.symvers
          with open('out/Module.symvers', 'w') as f:
              for name in sorted(existing.keys()):
                  # Android 5.15 modpost requires the fifth (namespace) field.
                  f.write(f'{existing[name]}\t{name}\tvmlinux\tEXPORT_SYMBOL_GPL\t\n')

          print(f'Final Module.symvers: {len(existing)} entries')
          PYEOF
          fi

          echo "=== Final Module.symvers: $(wc -l < out/Module.symvers) entries ==="
          # Validate the five-field Android 5.15 symbol dump format.
          awk -F '\t' 'NF != 5 { bad++ } END { if (bad) { print "FATAL: " bad " malformed Module.symvers rows"; exit 1 } }' out/Module.symvers

      - name: Patch check_version for CRC bypass
        run: |
          cd kernel
          python3 << 'PYEOF'
          import re
          with open('kernel/module.c', 'r') as f:
              content = f.read()
          pattern = r'(static int check_version\([^{]+\{)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              pos = match.end()
              content = content[:pos] + '\n\treturn 1; /* CRC bypass */' + content[pos:]
              with open('kernel/module.c', 'w') as f:
                  f.write(content)
              print('SUCCESS: Patched check_version()')
          else:
              print('ERROR: check_version() not found!')
              exit(1)
          PYEOF
          grep -n "return 1.*CRC bypass" kernel/module.c

      - name: Prevent git version suffix
        run: echo "" > kernel/.scmversion

      - name: Build only the WiFi external module trees
        timeout-minutes: 60
        run: |
          set -o pipefail
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          common_args=(
            O=out
            ARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            LOCALVERSION=
            KCFLAGS=-Wno-error
          )

          echo "=== Preparing kernel headers/scripts (no vmlinux link) ==="
          make "${common_args[@]}" -j$(nproc) modules_prepare

          # modules_prepare does not generate Module.symvers with
          # CONFIG_MODVERSIONS=y; preserve the validated five-field stock table
          # created by the previous step.
          test -s out/Module.symvers
          awk -F '\t' 'NF != 5 { bad++ } END { exit bad ? 1 : 0 }' out/Module.symvers

          echo "=== Building mac80211 as an external module tree ==="
          # External modpost automatically reads out/Module.symvers.
          make "${common_args[@]}" \
            M=$PWD/net/mac80211 \
            -j$(nproc) modules 2>&1 | tee build.log

          echo "=== Building ath/ath9k/ath9k_htc as an external module tree ==="
          # out/Module.symvers is automatic; add only mac80211 exports.
          set -x
          make "${common_args[@]}" \
            M=$PWD/drivers/net/wireless/ath \
            KBUILD_EXTRA_SYMBOLS=$PWD/net/mac80211/Module.symvers \
            -j$(nproc) modules 2>&1 | tee -a build.log
          set +x

          echo ""
          echo "=== Built WiFi modules ==="
          find net/mac80211 drivers/net/wireless/ath -name "*.ko" | sort
          echo "Total: $(find net/mac80211 drivers/net/wireless/ath -name '*.ko' | wc -l) modules"

      - name: Compare stock and generated wireless ABI layouts
        run: |
          set -euo pipefail
          cd kernel
          diag=$GITHUB_WORKSPACE/artifact/layout
          mkdir -p "$diag"

          stock_cfg=$(find /tmp/stock_modules -type f -name 'cfg80211.ko' | head -1)
          generated_mac=$(find net/mac80211 -type f -name 'mac80211.ko' | head -1)
          test -s "$stock_cfg"
          test -s "$generated_mac"

          echo "$stock_cfg" > "$diag/stock-cfg80211-path.txt"
          echo "$generated_mac" > "$diag/generated-mac80211-path.txt"
          readelf -S "$stock_cfg" > "$diag/stock-cfg80211-sections.txt"
          readelf -S "$generated_mac" > "$diag/generated-mac80211-sections.txt"

          # struct wiphy crosses the stock cfg80211/generated mac80211 boundary.
          # Its rfkill member was where run 88 crashed during USB disconnect.
          pahole -C wiphy "$stock_cfg" > "$diag/wiphy-stock.txt"
          pahole -C wiphy "$generated_mac" > "$diag/wiphy-generated.txt"
          diff -u "$diag/wiphy-stock.txt" "$diag/wiphy-generated.txt"             > "$diag/wiphy.diff" || {
              echo "FATAL: struct wiphy differs from the stock cfg80211 ABI"
              cat "$diag/wiphy.diff"
              exit 1
            }

          # Compare more public cfg80211 types when both modules retain them.
          for type in wireless_dev cfg80211_ops ieee80211_channel ieee80211_supported_band; do
            if pahole -C "$type" "$stock_cfg" > "$diag/$type-stock.txt" 2>/dev/null &&
               pahole -C "$type" "$generated_mac" > "$diag/$type-generated.txt" 2>/dev/null; then
              diff -u "$diag/$type-stock.txt" "$diag/$type-generated.txt"                 > "$diag/$type.diff" || {
                  echo "FATAL: struct $type differs from stock"
                  cat "$diag/$type.diff"
                  exit 1
                }
            else
              echo "$type unavailable in one module; skipped" > "$diag/$type-skipped.txt"
            fi
          done

          grep -n -E 'rfkill|size:' "$diag/wiphy-stock.txt" | tail -10
          echo "=== Wireless structure-layout gate passed ==="

      - name: Verify WiFi modules
        run: |
          cd kernel
          echo "=== WiFi module check ==="
          for mod in ath9k_htc ath9k_common ath9k_hw ath cfg80211 mac80211; do
            f=$(find net/mac80211 drivers/net/wireless/ath -name "${mod}.ko" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              echo "FOUND: $f ($(stat -c%s "$f") bytes)"
              modinfo "$f" 2>/dev/null | grep -E "vermagic|depends" || true
            else
              echo "MISSING: ${mod}.ko"
            fi
          done

      - name: Download AR9271 firmware
        run: |
          mkdir -p artifact/firmware/ath9k_htc
          wget -q "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw" \
            -O artifact/firmware/ath9k_htc/htc_9271-1.4.0.fw || \
          curl -sfL "https://raw.githubusercontent.com/endlessm/linux-firmware/master/ath9k_htc/htc_9271-1.4.0.fw" \
            -o artifact/firmware/ath9k_htc/htc_9271-1.4.0.fw || \
          echo "WARNING: Firmware download failed"

      - name: Package modules
        run: |
          cd kernel
          mkdir -p $GITHUB_WORKSPACE/artifact/modules

          # Copy WiFi-related modules
          for mod in ath9k_htc ath9k_common ath9k_hw ath cfg80211 mac80211 compat; do
            f=$(find net/mac80211 drivers/net/wireless/ath -name "${mod}.ko" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp "$f" $GITHUB_WORKSPACE/artifact/modules/
            fi
          done

          # Also copy ALL modules for reference
          mkdir -p $GITHUB_WORKSPACE/artifact/all_modules
          find net/mac80211 drivers/net/wireless/ath -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/artifact/all_modules/ \;

          cp build.log $GITHUB_WORKSPACE/artifact/ 2>/dev/null || true
          cp out/.config $GITHUB_WORKSPACE/artifact/kernel_config.txt 2>/dev/null || true

          # Create install script
          cat > $GITHUB_WORKSPACE/artifact/install_wifi.sh << 'INSTALL'
          #!/system/bin/sh
          # Run as root: su -c "sh /sdcard/install_wifi.sh"
          MODULE_DIR="/vendor/lib/modules"
          FW_DIR="/vendor/firmware/ath9k_htc"

          echo "=== Installing NetHunter WiFi modules ==="
          mount -o remount,rw /vendor 2>/dev/null || true

          mkdir -p "$MODULE_DIR"
          mkdir -p "$FW_DIR"

          # Copy modules
          for mod in cfg80211.ko mac80211.ko ath.ko ath9k_hw.ko ath9k_common.ko ath9k_htc.ko; do
            if [ -f "/sdcard/nethunter_modules/$mod" ]; then
              cp "/sdcard/nethunter_modules/$mod" "$MODULE_DIR/"
              echo "Installed: $mod"
            fi
          done

          # Copy firmware
          if [ -f "/sdcard/nethunter_modules/htc_9271-1.4.0.fw" ]; then
            cp "/sdcard/nethunter_modules/htc_9271-1.4.0.fw" "$FW_DIR/"
            echo "Installed: AR9271 firmware"
          fi

          # Load modules in order
          echo "=== Loading modules ==="
          insmod "$MODULE_DIR/cfg80211.ko" 2>/dev/null && echo "Loaded: cfg80211" || echo "Failed: cfg80211 (may already be loaded)"
          insmod "$MODULE_DIR/mac80211.ko" 2>/dev/null && echo "Loaded: mac80211" || echo "Failed: mac80211"
          insmod "$MODULE_DIR/ath.ko" 2>/dev/null && echo "Loaded: ath" || echo "Failed: ath_common"
          insmod "$MODULE_DIR/ath9k_hw.ko" 2>/dev/null && echo "Loaded: ath9k_hw" || echo "Failed: ath9k_hw"
          insmod "$MODULE_DIR/ath9k_common.ko" 2>/dev/null && echo "Loaded: ath9k_common" || echo "Failed: ath9k_common"
          insmod "$MODULE_DIR/ath9k_htc.ko" 2>/dev/null && echo "Loaded: ath9k_htc" || echo "Failed: ath9k_htc"

          echo ""
          echo "=== Checking ==="
          lsmod | grep ath
          dmesg | grep -i ath9k | tail -5
          echo "Done! Plug in AR9271 adapter now."
          INSTALL
          chmod +x $GITHUB_WORKSPACE/artifact/install_wifi.sh

          echo "=== Artifact contents ==="
          find $GITHUB_WORKSPACE/artifact/ -type f | head -30
          echo "WiFi modules:"
          ls -lh $GITHUB_WORKSPACE/artifact/modules/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-wifi-modules-rmx3830
          path: artifact/
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            kernel/build.log
            kernel/out/.config
            artifact/layout/
          retention-days: 14